<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gastos Mensuales</title>
<style>
body{margin:0;font-family:-apple-system;background:#EEF4FA}
.header{background:#123B63;color:#fff;padding:24px;border-radius:0 0 24px 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.k{font-size:12px;color:#64748B}
.v{font-size:22px;font-weight:bold}
.section{padding:0 16px 16px}
input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid #D6E0EA}
button{background:#123B63;color:#fff;border:none}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EEE}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#FFF;border-top:1px solid #DDD}
.nav button{flex:1;padding:12px;background:#FFF;border:none}
.page{display:none}.on{display:block}
</style>
</head>
<body>

<div id="home" class="page on">
<div class="header">
<h1>💰 Gastos Mensuales</h1>
<p>Dashboard Premium</p>
</div>

<div class="grid">
<div class="card"><div class="k">Ingresos</div><div id="ing" class="v" style="color:#16A34A">S/0.00</div></div>
<div class="card"><div class="k">Gastos</div><div id="gas" class="v" style="color:#DC2626">S/0.00</div></div>
<div class="card"><div class="k">Ahorro</div><div id="sav" class="v" style="color:#F59E0B">S/0.00</div></div>
<div class="card"><div class="k">Disponible</div><div id="dis" class="v" style="color:#0EA5E9">S/0.00</div></div>
</div>

<div class="section">
<div class="card">
<h3>Movimientos</h3>
<div id="lista"></div>
</div>
</div>
</div>

<div id="add" class="page">
<div class="header"><h2>➕ Registrar</h2></div>
<div class="section">
<div class="card">
<select id="tipo">
<option>Gasto</option>
<option>Ingreso</option>
</select>

<select id="cat">
<option>Alimentación</option>
<option>Transporte</option>
<option>Vivienda</option>
<option>Salud</option>
<option>Otros</option>
</select>

<input id="desc" placeholder="Descripción">
<input id="monto" type="number" placeholder="Monto">

<button onclick="guardar()">Guardar movimiento</button>
</div>
</div>
</div>
<!-- PANTALLA PRESUPUESTO -->
<div id="budget" class="page">

  <div class="header">
    <h2>📊 Presupuesto</h2>
    <p>Control mensual por categoría</p>
  </div>

  <div class="section">

    <div class="card">
      <h3>💰 Presupuesto del mes</h3>

      <label>Alimentación</label>
      <input type="number" id="p_alim" value="600">

      <label>Transporte</label>
      <input type="number" id="p_trans" value="250">

      <label>Vivienda</label>
      <input type="number" id="p_viv" value="1200">

      <label>Salud</label>
      <input type="number" id="p_salud" value="150">

      <button onclick="guardarPresupuesto()">
        Guardar presupuesto
      </button>
    </div>

    <div class="card">
      <h3>📈 Resumen</h3>

      <div class="row">
        <span>Alimentación</span>
        <b id="r_alim">S/0</b>
      </div>

      <div class="row">
        <span>Transporte</span>
        <b id="r_trans">S/0</b>
      </div>

      <div class="row">
        <span>Vivienda</span>
        <b id="r_viv">S/0</b>
      </div>

      <div class="row">
        <span>Salud</span>
        <b id="r_salud">S/0</b>
      </div>

    </div>

  </div>

</div>
<div class="nav">
  <button onclick="cambiar('home')">🏠</button>
  <button onclick="cambiar('add')">➕</button>
  <button onclick="cambiar('budget')">📊</button>
</div>

<script>
let db=JSON.parse(localStorage.getItem("gastos")||"[]");

function cambiar(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
document.getElementById(id).classList.add("on");
}

function guardar(){
let m=parseFloat(monto.value||0);
if(!m)return;

db.push({
t:tipo.value,
c:cat.value,
d:desc.value||"Sin descripción",
m:m
});

localStorage.setItem("gastos",JSON.stringify(db));

desc.value="";
monto.value="";

render();
cambiar("home");
}

function render(){
let ing=0,gas=0;
lista.innerHTML="";

[...db].reverse().forEach(x=>{
lista.innerHTML+=`
<div class="row">
<span>${x.d}</span>
<b>${x.t=="Gasto"?"-":"+"}S/${x.m.toFixed(2)}</b>
</div>`;

if(x.t=="Ingreso") ing+=x.m;
else gas+=x.m;
});

ing.textContent="S/"+ing.toFixed(2);
gas.textContent="S/"+gas.toFixed(2);
sav.textContent="S/"+(ing-gas).toFixed(2);
dis.textContent="S/"+(ing-gas).toFixed(2);
}

render();
</script>

</body>
</html>
